# -----------------------------
# Microservices Interview Steps
# -----------------------------
# 1) Start registry profile first: SPRING_PROFILES_ACTIVE=service-registry
# 2) Start auth server (or external IdP) on port 9000
# 3) Start business services with default profile or resource-server profile
# 4) Start gateway profile and route requests through it
# 5) Validate load balancing by running multiple instances of same service
# 6) Stop one downstream instance and show circuit breaker OPEN -> HALF_OPEN -> CLOSED
# 7) Demonstrate OAuth2 flow: token issuance, propagation, and resource protection

# Service Discovery / Registry Client
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Load Balancer
spring.cloud.discovery.enabled=true
spring.cloud.loadbalancer.retry.enabled=true

# Circuit Breaker (Resilience4j)
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3

# Observability for health and circuit breaker demonstration
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ---
# API Gateway profile
# Activate with: SPRING_PROFILES_ACTIVE=gateway
# ---
#---
spring.config.activate.on-profile=gateway
spring.main.web-application-type=reactive
server.port=${GATEWAY_PORT:8080}
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

# ---
# Service Registry profile (Eureka Server)
# Activate with: SPRING_PROFILES_ACTIVE=service-registry
# ---
#---
spring.config.activate.on-profile=service-registry
server.port=${REGISTRY_PORT:8761}
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.server.enable-self-preservation=false

# ---
# OAuth2 Resource Server profile
# Activate with: SPRING_PROFILES_ACTIVE=resource-server
# ---
#---
spring.config.activate.on-profile=resource-server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER_URI:http://localhost:9000}

# ---
# OAuth2 Client profile
# Activate with: SPRING_PROFILES_ACTIVE=oauth-client
# ---
#---
spring.config.activate.on-profile=oauth-client
spring.security.oauth2.client.registration.interview-client.client-id=${OAUTH_CLIENT_ID:interview-client}
spring.security.oauth2.client.registration.interview-client.client-secret=${OAUTH_CLIENT_SECRET:interview-secret}
spring.security.oauth2.client.registration.interview-client.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.interview-client.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.interview-client.scope=openid,profile
spring.security.oauth2.client.provider.interview-client.issuer-uri=${OAUTH_ISSUER_URI:http://localhost:9000}
